* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ============ AI 出题 / 配置 / 语篇 ============ */
.form-row { margin: 10px 0; }

.ai-status-ok { border-color: rgba(62,207,142,0.45); color: var(--ok); }
.ai-status-bad { border-color: rgba(255,93,122,0.5); color: var(--bad); }

/* AI 语篇面板 */
.passage-panel { background: rgba(255,255,255,0.05); border: 1px solid var(--stroke); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }

.passage-body { font-size: 16px; line-height: 2.0; }

.passage-blank.cur { color: var(--warn); border-bottom-color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 0 3px; }

/* 年级切换 Tab */

/* 大专题卡片 */

.sheet-paper { margin-top: 12px; }
.sheet-paper-top { position: sticky; top: 0; z-index: 8;

.sheet-cards { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

/* ==================== 品牌署名 · 授权（Hison） ====================
   注意：本区块会被 build.js 原样注入 brand.js，由运行时二次写入并自愈守护。
   删除本区块不会移除署名（脚本会重建）；删除 brand.js 则应用拒绝启动。 */
/* 右下角署名印章：平时是一枚小胶囊，悬停 / 点击后原地展开署名卡片（无弹窗） */
.egl-seal {
  position: fixed; right: 12px; bottom: 12px; z-index: 46;
  display: block; text-align: left; overflow: hidden;
  padding: 6px 11px; border-radius: 13px; cursor: pointer;
  font-family: inherit; color: rgba(238, 241, 251, 0.76);
  background: rgba(10, 14, 30, 0.62);
  border: 1px solid rgba(165, 194, 255, 0.26);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  opacity: 0.88; transform-origin: 100% 100%;
  transition: padding 0.34s var(--ease), border-radius 0.34s var(--ease),
              background 0.3s, box-shadow 0.34s, opacity 0.24s, transform 0.34s var(--ease);
}
.egl-seal-face {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
}
.egl-seal-panel {
  display: block; width: 0; max-height: 0; opacity: 0; margin-top: 0;
  overflow: hidden; white-space: nowrap; transform: translateY(6px);
  transition: width 0.34s var(--ease), max-height 0.34s var(--ease), opacity 0.26s ease,
              transform 0.34s var(--ease), margin-top 0.34s var(--ease);
}
.egl-seal-name { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: 0.4px; color: var(--ink); }
.egl-seal-row { display: block; font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
.egl-seal-row i { font-style: normal; color: var(--ink-faint); margin-right: 6px; }
.egl-seal-row b { color: var(--hl); font-weight: 800; letter-spacing: 0.4px; }
/* 展开态：键盘聚焦 / 点击（触摸） */
.egl-seal:focus-visible,
.egl-seal.on {
  padding: 12px 15px 13px; border-radius: 18px;
  background: rgba(10, 14, 30, 0.94);
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
  opacity: 1; transform: translateY(-2px);
}
.egl-seal:focus-visible .egl-seal-panel,
.egl-seal.on .egl-seal-panel { width: 156px; max-height: 130px; opacity: 1; transform: none; margin-top: 8px; }
/* 有鼠标的设备：悬停即展开 */
@media (hover: hover) {
  .egl-seal:hover {
    padding: 12px 15px 13px; border-radius: 18px;
    background: rgba(10, 14, 30, 0.94);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
    opacity: 1; transform: translateY(-2px);
  }
  .egl-seal:hover .egl-seal-panel { width: 156px; max-height: 130px; opacity: 1; transform: none; margin-top: 8px; }
}
/* 题卡底纹已撤掉：部分机型浏览器（如荣耀浏览器）会把低透明度的水印墨迹
   （SVG 图片版、文本 rgba 版都试过）自动提亮成实心白，糊在题干与选项上。
   署名改由各处角标承担：题卡左下角 + 其它卡片右下角各一行小字，浓淡是
   固定色 + 固定 opacity，与页面其它文字一致，各机型都不会被提亮，
   截图、打印都带署名。 */
/* 卡片角标 */
.learn-head, .score-hero, .sq-card, .qbox { position: relative; }
.learn-head { padding-bottom: 22px; }
.sq-card { padding-bottom: 22px; }
.score-hero { padding-bottom: 30px; }
.learn-head::after, .score-hero::after, .sq-card::after, .qbox::after {
  content: "by __EGL_NM__";
  position: absolute; right: 10px; bottom: 6px;
  font-size: 10px; letter-spacing: 1px; font-weight: 700;
  color: var(--ink-faint); opacity: 0.55;
  pointer-events: none; user-select: none;
}
/* 题卡角标放左下：右下是固定印章的位置，靠太近会叠在一起 */
.qbox::after { right: auto; left: 12px; }
/* 页脚署名 */
.egl-foot { text-align: center; padding: 30px 14px 22px; color: var(--ink-faint); font-size: 12px; }
.egl-foot .egl-foot-main { color: var(--ink-faint); }
.egl-foot .egl-foot-brand { margin-top: 5px; color: var(--ink-dim); letter-spacing: 0.3px; line-height: 1.8; }
.egl-foot .egl-foot-links { margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.egl-foot .egl-link {
  border: 0; background: transparent; color: var(--accent); cursor: pointer;
  font-family: inherit; font-size: 12px; padding: 3px 4px; text-decoration: underline;
}
.egl-foot .egl-tip { color: var(--ink-faint); font-size: 11px; }
/* 页脚版本号（构建时由 package.json 注入） */
.egl-foot .egl-foot-ver { margin-top: 4px; color: var(--ink-faint); font-size: 11px; letter-spacing: 0.6px; opacity: 0.8; }
/* 首页品牌小标签 */
.egl-chip {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;

/* 首页副标题下的适用范围标签 */
.hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hero-tags span {
  font-size: 11px; letter-spacing: 0.4px; color: var(--ink-dim);
  border: 1px solid rgba(165, 194, 255, 0.26); border-radius: 999px; padding: 2px 9px;
}
.hero-tags span.hot { color: var(--glow); border-color: rgba(255, 224, 130, 0.34); }
/* 授权说明弹窗 */
.egl-lic p { margin: 6px 0; font-size: 13.5px; color: var(--ink-dim); line-height: 1.7; }
.egl-lic p b { color: var(--ink); }
@media print {
  .egl-seal { display: none; }
  .learn-head::after, .score-hero::after, .sq-card::after, .qbox::after { color: #222; opacity: 0.75; }
  .egl-foot { color: #333; }
}

<script>
/* data/roadmap.js — 全部 60 个专题的路线图（13-60 暂未开放，仅展示） */

/* ============================================================
 * core.js — English Grammar Lab 核心引擎
 * 数据 / 存储 / 答题判定 / 分析 / 推荐 / 错题本

 * 题库注册表：window.__GRAMMAR_LAB__ （data/*.js 写入）

 * ============================================================ */
(function () {

  /* ---------- 工具 ---------- */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

    var d = new Date();

  }
  function nowTs() { return Date.now(); }
  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;

    return a;
  }
  // 作者隐形指纹（brand.js 提供；缺失时原样返回，不影响任何逻辑）
  function markText(s) {
    var b = window.EGL_BRAND || (window.EGL && window.EGL.brand);

  /* ---------- 答案归一化 ---------- */
  function normalizeAnswer(s) {
    if (s == null) return '';
    s = String(s)
      .replace(/[\u2018\u2019\u201C\u201D]/g, "'")
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase()
      .replace(/[.,!?;:。，！？；：]+$/, '');
    // 先处理特殊整体缩写，再做通用词尾展开，便于 "hasn't finished" == "has not finished"
    var special = {
      "won't": 'will not', "can't": 'cannot', "shan't": 'shall not', 'cannot': 'can not',
      "don't": 'do not', "doesn't": 'does not', "didn't": 'did not',
      "isn't": 'is not', "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not',
      "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not',
      "couldn't": 'could not', "shouldn't": 'should not', "wouldn't": 'would not',
      "mustn't": 'must not', "needn't": 'need not'
    };
    s = s.replace(/\b(?:won't|shan't|can't|cannot|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|haven't|hasn't|hadn't|couldn't|shouldn't|wouldn't|mustn't|needn't)\b/g,
      function (w) { return special[w] || w; })
      .replace(/'ve\b/g, ' have')
      .replace(/'ll\b/g, ' will')
      .replace(/'re\b/g, ' are')
      .replace(/'m\b/g, ' am')
      .replace(/n't\b/g, ' not')
      .replace(/\s+/g, ' ')
      .trim();
    return s;
  }
  function stripApostrophes(s) { return s.replace(/'/g, ''); }

  function checkInputAnswer(userInput, accepted) {
    var u = normalizeAnswer(userInput);
    if (!u) return false;
    var plainU = stripApostrophes(u);
    var i, a, plainA;
    for (i = 0; i < (accepted || []).length; i++) {
      a = normalizeAnswer(accepted[i]);
      if (!a) continue;
      if (a === u) return true;
      plainA = stripApostrophes(a);
      if (plainA === plainU) return true;
      if (a.replace(/ /g, '') === u.replace(/ /g, '')) return true;
      if (plainA.replace(/ /g, '') === plainU.replace(/ /g, '')) return true;
    }
    return false;
  }

  /* ---------- 默认数据 ---------- */
  function emptyData() {
    return {
      version: 2,
      global: { answered: 0, correct: 0 },
      topics: {},
      tags: {},
      errorTypes: {},
      wrongBook: [],
      sessions: [],
      daily: {},
      usedPool: {},
      challengeUnlocked: {},
      lastStudyAt: 0,
      createdAt: nowTs()
    };
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return emptyData();
      var d = JSON.parse(raw);
      if (!d || (d.version !== 1 && d.version !== 2)) return emptyData();
      if (d.version === 1) d.version = 2;              // 平滑升级
      if (!d.global) d.global = { answered: 0, correct: 0 };
      return d;
    } catch (e) {
      try { localStorage.removeItem(LS_KEY); } catch (e2) {}
      return emptyData();
    }
  }
  var data = loadData();
  var saveListener = null;
  // 任意一次自动保存后回调（右上角"已保存"提示由 UI 注册；无 UI 环境不注册即可）
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
    if (typeof saveListener === 'function') {
      try { saveListener(); } catch (e2) {}
    }
  }
  function setSaveListener(fn) { saveListener = fn; }

  /* ---------- 题库注册表 ---------- */
  function bank() { return window.__GRAMMAR_LAB__ || window.GRAMMAR_BANK || {}; }
  function roadmap() { return window.__GRAMMAR_LAB_ROADMAP__ || window.GRAMMAR_ROADMAP || null; }

  function topicMeta(no) {
    var r = roadmap();
    if (!r) return null;
    for (var i = 0; i < r.topics.length; i++) if (r.topics[i].no === no) return r.topics[i];
    return null;
  }
  // 可用（有题库）的专题 id 列表，按序号排序
  function availableTopicIds() {
    var keys = Object.keys(bank()).filter(function (k) {
      return /^tense\d\d$/.test(k) && bank()[k].questions && bank()[k].questions.length;
    });
    keys.sort();
    return keys;
  }
  function isChallengeAvailable() { return !!(bank().challenge && bank().challenge.questions); }

  /* ---------- 专题统计 ---------- */
  function topicStat(tid) {
    if (!data.topics[tid]) {
      data.topics[tid] = { attempts: 0, correct: 0, runs: 0, lastCorrect: 0, lastTotal: 0, lastMode: '', finished: false, bestRunPct: 0, lastAt: 0 };
    }
    return data.topics[tid];
  }
  // 核心12题整体正确率
  function topicAccuracy(tid) {
    var s = topicStat(tid);
    return s.attempts === 0 ? null : (s.correct / s.attempts);
  }
  function topicStatus(tid) {
    var s = topicStat(tid);
    if (s.attempts === 0) return 'none';
    var acc = s.correct / s.attempts;
    if (acc >= 0.9 && s.finished) return 'master';
    if (acc >= 0.7) return 'learning';
    return 'weak';
  }
  // 只统计“核心整轮”（kind = normal|blind，total>=12）；drill/retrain/challenge 不计入专题主正确率
  function updateTopicStat(tid, correctCount, totalCount, mode) {
    var s = topicStat(tid);
    var isCoreRun = (mode === 'normal' || mode === 'blind') && totalCount >= 10;
    if (isCoreRun) {
      s.attempts += totalCount;
      s.correct += correctCount;
      s.runs++;
      s.lastCorrect = correctCount;
      s.lastTotal = totalCount;
      s.lastMode = mode;
      s.lastAt = nowTs();
      if (totalCount >= 12) s.finished = true;
      var runAcc = correctCount / totalCount;
      if (runAcc > s.bestRunPct) s.bestRunPct = runAcc;
      var acc = s.correct / s.attempts;
      if (acc >= 0.9 && s.finished) data.challengeUnlocked[tid] = true;
    }
    data.lastStudyAt = nowTs();
    save();
  }
  // 答对是否解锁挑战（≥90% 且完成过整轮）
  function isChallengeUnlocked(tid) {
    if (data.challengeUnlocked[tid]) return true;
    var s = topicStat(tid);
    return !!s.finished && s.bestRunPct >= 0.9;
  }

  // 全局计数（任何作答都计入）
  function addGlobal(correct, total) {
    data.global.answered += total;
    data.global.correct += correct;
    save();
  }

  // 记录单题到 tag 统计
  function recordTag(topicId, tag, correct) {
    var key = topicId + '|' + tag;
    if (!data.tags[key]) data.tags[key] = { attempts: 0, correct: 0, streakWrong: 0, lastWrong: false };
    var t = data.tags[key];
    t.attempts++;
    if (correct) { t.correct++; t.streakWrong = 0; t.lastWrong = false; }
    else { t.streakWrong++; t.lastWrong = true; }
    save();
    return t;
  }
  function tagAccuracy(topicId, tag) {
    var key = topicId + '|' + tag;
    var t = data.tags[key];
    return t ? (t.attempts ? t.correct / t.attempts : null) : null;
  }

  /* ---------- 大专题(curriculum) 能力统计 ----------
   * 题源 tag 的 topicId 可能是 'tense01'（原题库）或 'ai:<大专题id>'（AI 题），
   * 统一归入大专题统计，供"我的语法填空能力总览"使用。
   */
  function catOfTopicId(topicId) {
    if (!topicId) return 'verb';
    if (topicId.indexOf('ai:') === 0) return topicId.slice(3);
    if (topicId === 'challenge') return 'verb';
    var no = String(topicId).replace(/^tense/, '');
    var cur = window.__EGL_CURRICULUM__;
    if (cur && cur.catByTopicNo) {
      var c = cur.catByTopicNo(no);

  }

  function categoryStats() {

      var p = key.indexOf('|');
      if (p < 0) return;
      var cat = catOfTopicId(key.slice(0, p));
      if (!map[cat]) map[cat] = { attempts: 0, correct: 0 };
      var t = data.tags[key];
      map[cat].attempts += t.attempts;
      map[cat].correct += t.correct;
    });
    var out = [];
    Object.keys(map).forEach(function (cat) {
      var c = map[cat];
      var meta = categoryName(cat);
      out.push({ catId: cat, name: meta.name, icon: meta.icon, color: meta.color || '#8b93b5',
                 attempts: c.attempts, correct: c.correct,
                 pct: c.attempts ? c.correct / c.attempts : null });
    });

  /* ---------- 错题本 ---------- */
  function findWrongEntry(qid) {

  function addWrong(item) {

      found.entry.lastAt = nowTs();
      found.entry.myAnswer = item.myAnswer;

    }
    var entry = {
      id: 'wb_' + item.qid,
      topicId: item.topicId,
      topicTitle: item.topicTitle || '',
      qid: item.qid,
      question: markText(item.question),   // 错题记录同样带作者隐形指纹
      tag: item.tag || '',
      myAnswer: item.myAnswer,
      correctAnswer: item.correctAnswer,

      stage: item.stage || '',                // 阶段

      lastDate: todayStr(),

  /* ---------- 每日与总览 ---------- */

  }
  function addDaily(correct, total) {
    var d = dailyToday();
    d.answered += total;
    d.correct += correct;
    save();
  }

    var tids = availableTopicIds();

      answered: data.global.answered,
      correct: data.global.correct,

    if (data.sessions.length > 1000) data.sessions.splice(0, data.sessions.length - 1000);

  }

  function tagList() {
    var out = [];
    Object.keys(data.tags).forEach(function (key) {
      var t = data.tags[key];
      var parts = key.split('|');
      out.push({ topicId: parts[0], tag: parts[1], attempts: t.attempts, correct: t.correct,
                 pct: t.attempts ? t.correct / t.attempts : null, streakWrong: t.streakWrong });
    });

  }
  function weakTopics() {
    var tids = availableTopicIds();
    var arr = [];
    tids.forEach(function (tid) {
      var s = topicStat(tid);
      if (s.attempts > 0) {
        arr.push({ id: tid, meta: metaOfTopic(tid), attempts: s.attempts, correct: s.correct,
                   pct: s.correct / s.attempts, finished: s.finished, status: topicStatus(tid) });
      }
    });
    arr.sort(function (a, b) { return a.pct - b.pct; });
    return arr;
  }
  function metaOfTopic(tid) {
    var b = bank();
    if (b[tid]) return b[tid];
    var no = tid.replace('tense', '');
    var m = topicMeta(no);
    if (m) return m;
    return null;
  }
  function nextUnstarted() {
    var tids = availableTopicIds();
    for (var j = 0; j < tids.length; j++) {
      var st = topicStat(tids[j]);
      if (st.attempts === 0) return tids[j];
    }
    return null;
  }
  function recommendNext() {
    var weak = weakTopics();
    for (var i = 0; i < weak.length; i++) {
      if (weak[i].pct < 0.9 && weak[i].attempts >= 6) {
        return { type: 'topic', topicId: weak[i].id, reason: '该专题正确率 ' + Math.round(weak[i].pct * 100) + '%，是目前最需要加强的。' };
      }
    }
    var next = nextUnstarted();
    if (next) return { type: 'topic', topicId: next, reason: '这是你的下一个新专题，按顺序学下去最稳。' };
    if (weak.length) return { type: 'topic', topicId: weak[0].id, reason: '核心专题都练过了，从正确率最低的开始回炉巩固。' };
    return { type: 'challenge', reason: '试试综合挑战，检验真实判断力。' };
  }

  /* ---------- 题库查询 ---------- */
  function topicQuestions(tid) {
    var t = bank()[tid];
    return t ? (t.questions || []) : [];
  }
  function poolQuestions(tid) {
    var t = bank()[tid];
    return t ? (t.pool || []) : [];
  }
  function findQuestion(tid, qid) {
    var list = topicQuestions(tid).concat(poolQuestions(tid));
    for (var i = 0; i < list.length; i++) if (list[i].id === qid) return list[i];
    return null;
  }
  function markPoolUsed(tid, q) {
    if (!data.usedPool[tid]) data.usedPool[tid] = {};
    data.usedPool[tid][q.id] = (data.usedPool[tid][q.id] || 0) + 1;
    save();
  }
  function poolFresh(tid) {
    var used = data.usedPool[tid] || {};
    var pool = poolQuestions(tid);
    var fresh = pool.filter(function (q) { return !used[q.id]; });
    return fresh.length ? fresh : pool;
  }
  // “再练5题”：优先指定 tag（薄弱点）的 pool 新题，不足用该专题其他 pool 新题
  function pickRetrain(tid, tag, count) {
    count = count || 5;
    var fresh = poolFresh(tid);
    var byTag = fresh.filter(function (q) { return q.tag === tag; });
    var rest = fresh.filter(function (q) { return q.tag !== tag; });
    var picked = byTag.slice(0, count);
    var need = count - picked.length;
    if (need > 0) picked = picked.concat(rest.slice(0, need));
    // pool 不足 5 时从核心题里按难度补足
    need = count - picked.length;
    if (need > 0) {
      var core = topicQuestions(tid).filter(function (q) { return q.type === 'input'; });
      core = shuffle(core).slice(0, need);
      picked = picked.concat(core);
    }
    picked.forEach(function (q) { markPoolUsed(tid, q); });
    return picked;
  }
  // 挑战模式5题：从 pool 里抽（全输入、15-30词）
  function pickChallenge(tid) {
    return pickRetrain(tid, null, 5);
  }
  // 错题回炉（挑输入题）
  function pickWrongRetrain(topicId, count) {
    count = count || 5;
    var wb = data.wrongBook.filter(function (w) { return w.topicId === topicId; });
    var qs = [];
    wb.forEach(function (w) {
      var q = findQuestion(topicId, w.qid);
      if (q && q.type === 'input' && qs.length < count) qs.push(q);
    });
    var pool = poolFresh(topicId);
    var extra = pool.filter(function (q) { return qs.indexOf(q) < 0; });
    return qs.concat(extra).slice(0, count);
  }

  // 数据导入导出（防丢数据）
  function exportData() {
    var out = data;
    try {
      var b = window.EGL_BRAND || (window.EGL && window.EGL.brand);
      var st = (b && b.stamp) ? b.stamp() : null;
      if (st) {
        // 版权元数据随备份文件一起传播（导入时忽略，不影响数据结构）
        out = deepClone(data);
        out._brand = st;
        out._notice = '本数据由 ' + st.tag + ' 的 English Grammar Lab 导出，仅供个人免费学习使用，禁止商用。'
          + ' 抖音 ' + st.douyin + ' · 小红书 ' + st.xhs;
      }
    } catch (e) { out = data; }
    return JSON.stringify(out, null, 1);
  }
  function importData(json) {
    try {
      var d = JSON.parse(json);
      if (!d || !d.global) return false;
      delete d._brand; delete d._notice;
      data = d;
      save();
      return true;
    } catch (e) { return false; }
  }
  function resetData() { data = emptyData(); save(); }

  /* ---------- 对外 API ---------- */
  EGL.util = { pad2: pad2, todayStr: todayStr, nowTs: nowTs, deepClone: deepClone, shuffle: shuffle,
               normalizeAnswer: normalizeAnswer, checkInputAnswer: checkInputAnswer };
  EGL.data = data;
  EGL.save = save;
  EGL.setSaveListener = setSaveListener;
  EGL.loadData = loadData;
  EGL.bank = bank;
  EGL.roadmap = roadmap;
  EGL.topicMeta = topicMeta;
  EGL.availableTopicIds = availableTopicIds;
  EGL.isChallengeAvailable = isChallengeAvailable;
  EGL.topicStat = topicStat;
  EGL.topicAccuracy = topicAccuracy;
  EGL.topicStatus = topicStatus;
  EGL.updateTopicStat = updateTopicStat;
  EGL.isChallengeUnlocked = isChallengeUnlocked;
  EGL.addGlobal = addGlobal;
  EGL.recordTag = recordTag;
  EGL.tagAccuracy = tagAccuracy;
  EGL.addWrong = addWrong;
  EGL.removeWrong = removeWrong;
  EGL.clearWrong = clearWrong;
  EGL.addDaily = addDaily;
  EGL.overallStats = overallStats;
  EGL.addSession = addSession;
  EGL.sessionsOfTopic = sessionsOfTopic;
  EGL.tagList = tagList;
  EGL.weakTopics = weakTopics;
  EGL.metaOfTopic = metaOfTopic;
  EGL.nextUnstarted = nextUnstarted;
  EGL.recommendNext = recommendNext;
  EGL.topicQuestions = topicQuestions;
  EGL.poolQuestions = poolQuestions;
  EGL.findQuestion = findQuestion;
  EGL.pickRetrain = pickRetrain;
  EGL.pickChallenge = pickChallenge;
  EGL.pickWrongRetrain = pickWrongRetrain;
  EGL.exportData = exportData;
  EGL.importData = importData;
  EGL.resetData = resetData;
  EGL.catOfTopicId = catOfTopicId;
  EGL.categoryName = categoryName;
  EGL.categoryStats = categoryStats;
})();


/* ============================================================
 * ui-helpers.js — DOM 工具 / 渲染组件（无状态纯函数）
 * ============================================================ */
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // 把带 \n 的文本转成 <br>
  function lines(s) { return esc(s).replace(/\n/g, '<br>'); }

  /* ---------- 数值显示 ---------- */
  function pct(x) { return Math.round(x * 100) + '%'; }
  function fmtTime(sec) {
    sec = Math.round(sec || 0);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + '分' + (s < 10 ? '0' : '') + s + '秒';
  }

  /* ---------- 等级映射 ----------
   * 12题制：12=S 11=A+ 10=A 9=B+ 8=B 6-7=C ≤5=D
   * 其它题量按比例折算到 12 题制 */
  function gradeOf(correct, total) {
    if (!total) return { g: '—', color: '#8b93b5' };
    var x = Math.round((correct / total) * 12);
    if (x >= 12) return { g: 'S', color: '#ffd54f' };
    if (x === 11) return { g: 'A+', color: '#9be15d' };
    if (x === 10) return { g: 'A', color: '#3ecf8e' };
    if (x === 9) return { g: 'B+', color: '#5b8cff' };
    if (x === 8) return { g: 'B', color: '#5b8cff' };
    if (x >= 6) return { g: 'C', color: '#ffb84d' };
    return { g: 'D', color: '#ff5d7a' };
  }

  /* ---------- 状态图标 ---------- */
  function statusBadge(st) {
    if (st === 'master') return '<span class="badge green">🟢 已掌握</span>';
    if (st === 'learning') return '<span class="badge blue">🟡 学习中</span>';
    if (st === 'weak') return '<span class="badge red">🔴 薄弱</span>';
    return '<span class="badge gray">⚪ 未开始</span>';
  }

  /* ---------- 题目文本渲染（把 ______ 变成醒目的空） ---------- */
  // opts.hideInlineHint：输入框已另显提示词字卡时，题干里不再追加 (hint)
  function renderSentence(q, opts) {
    opts = opts || {};
    var s = String(q.question || '');
    var hasBlank = s.indexOf('______') >= 0;
    var h = esc(s);
    var blankHtml = '<span class="blank">______</span>';
    if (hasBlank) {
      h = h.replace('______', blankHtml);
    }
    // 高亮 hint 位置（在空之后追加）——仅在需要内联提示时
    if (!opts.hideInlineHint && q.type === 'input' && q.hint) {
      var hintText = String(q.hint).replace(/\s*\/\s*/g, ' / ');
      // 若题干已自带 (hint) 则不重复
      if (s.indexOf('(' + q.hint + ')') < 0) {
        h = h.replace(blankHtml, blankHtml + ' <span class="hint-p">(' + esc(hintText) + ')</span>');
      }
    }
    return '<span class="qtext">' + h + '</span>';
  }

  // AI 语篇面板：整篇展示，所有空为编号下划线，当前空高亮（不显示答案）
  function passagePanelHTML(aiCtx) {
    if (!aiCtx || !aiCtx.passage) return '';
    var curN = aiCtx.blankN || 1;
    var parts = String(aiCtx.passage).split(/_{4,}/);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      out.push(esc(parts[i]).replace(/\n/g, '<br>'));
      if (i < parts.length - 1) {
        var n = i + 1;
        out.push('<span class="passage-blank' + (n === curN ? ' cur' : '') + '">(' + n + ')______</span>');
      }
    }
    var meta = '<div class="passage-title">📄 ' + esc(aiCtx.title || '语篇')
      + ' <span class="faint">· 语篇 ' + (aiCtx.paperIndex + 1) + '/' + aiCtx.paperCount
      + ' · 共 ' + aiCtx.total + ' 空 · 当前第 ' + curN + ' 空</span></div>';
    return '<div class="passage-panel">' + meta + '<div class="passage-body">' + out.join('') + '</div></div>';
  }

  /* ---------- 解析渲染（全部在 <details> 内） ---------- */
  function explanationHTML(q, ctx) {
    var ex = q.explanation || {};
    ctx = ctx || {};
    var b = [];
    b.push('<div class="explain">');

    // 考点标签（如需复盘）：考点：时态 / 细分子点
    if (ctx.grammar) {
      b.push('<div class="ex-mod" style="margin-top:0">'
        + '<span class="badge badge-grammar">考点：' + esc(ctx.grammar) + '</span>'
        + (q.tag ? ' <span class="badge blue">' + esc(q.tag) + '</span>' : '')
        + '</div>');
    }

    // 正确答案展示
    var corText = ctx.correctText || ex.answer || q.answerText || '';
    b.push('<div class="ex-mod"><span class="lb2" style="color:var(--ok)">✅ 正确答案：</span>');
    b.push('<span class="ans-chip">' + esc(corText) + '</span>');
    if (ctx.myText !== undefined && ctx.myText !== null && ctx.myText !== '') {
      b.push(' <span style="font-size:13px;color:var(--ink-dim)">我的答案：<b style="color:'
        + (ctx.myOk ? 'var(--ok)' : 'var(--bad)') + '">' + esc(ctx.myText) + '</b></span>');
    }
    b.push('</div>');

    if (ex.keyPoint) b.push('<div class="ex-mod"><span class="lb2">📌 考查知识点</span><div>' + lines(ex.keyPoint) + '</div></div>');
    if (ex.clue) b.push('<div class="ex-mod"><span class="lb2">🔎 本题关键线索</span><div>' + lines(ex.clue) + '</div></div>');
    if (ex.trap) b.push('<div class="ex-mod"><span class="lb2">⚠️ 不要被什么骗了</span><div>' + lines(ex.trap) + '</div></div>');
    if (ex.chain) b.push('<div class="ex-mod"><span class="lb2">🧗 判断链（一步一步想）</span><div class="chain">' + chainHTML(ex.chain) + '</div></div>');
    if (ex.why) b.push('<div class="ex-mod"><span class="lb2">💡 为什么是这个答案</span><div>' + lines(ex.why) + '</div></div>');
    if (ex.whyOthers) {
      b.push('<div class="ex-mod"><span class="lb2">❓ 为什么其他答案不合适</span>');
      b.push('<ul class="why-others">');
      String(ex.whyOthers).split(/\n+/).forEach(function (li) {
        var t = String(li).trim();
        if (!t) return;
        // 开头 A. / B. 之类加粗
        b.push('<li>' + t.replace(/^([A-F][.、．:：])\s*/, '<b>$1</b> ') + '</li>');
      });
      b.push('</ul></div>');
    }
    if (ex.commonError) b.push('<div class="ex-mod"><span class="lb2">🚨 容易犯的错误</span><div>' + lines(ex.commonError) + '</div></div>');
    if (ex.memory) b.push('<div class="ex-mod"><span class="lb2">🧠 一句话记忆</span><div>' + lines(ex.memory) + '</div></div>');
    if (ex.examMind) b.push('<div class="ex-mod"><span class="lb2">🏁 如果你在考试现场</span><div>' + lines(ex.examMind) + '</div></div>');
    if (ex.cue) b.push('<div class="ex-mod"><span class="lb2">🧠 以后看到什么，就想到什么？</span><div class="chain">' + chainHTML(ex.cue) + '</div></div>');

    b.push('</div>');
    return b.join('');
  }

  // 把 “A ↓ B ↓ C” 或含 → 的文本渲染成步骤
  function chainHTML(s) {
    var parts = String(s).split(/↓|→|=>|⇒/);
    var out = [];
    parts.forEach(function (p, i) {
      var t = String(p).trim();
      if (!t) return;
      out.push('<span class="step">' + esc(t) + '</span>');
      if (i < parts.length - 1) out.push('<span class="arr">↓</span>');
    });
    return out.join('');
  }

  /* ---------- 知识卡渲染 ---------- */
  function knowledgeCardHTML(topic) {
    var kc = topic.knowledgeCard || {};
    var b = [];
    b.push('<div class="kcard glass">');
    b.push('<h2>' + (topic.icon || '📘') + ' ' + esc(topic.no) + ' ' + esc(topic.title) + '</h2>');
    if (kc.oneLine) b.push('<div class="kblock"><div class="lb">一句话理解</div><p>' + lines(kc.oneLine) + '</p></div>');
    if (kc.structure) b.push('<div class="kblock"><div class="lb">基本结构</div><p>' + lines(kc.structure) + '</p></div>');
    if (kc.glossary && kc.glossary.length) {
      b.push('<div class="kblock"><div class="lb">先弄懂这些词（不装懂）</div>');
      kc.glossary.forEach(function (g) {
        b.push('<div class="gloss"><b>' + esc(g.term) + '</b>：' + lines(g.note) + '</div>');
      });
      b.push('</div>');
    }
    if (kc.scenes && kc.scenes.length) {
      b.push('<div class="kblock"><div class="lb">常见场景 / 标志</div><ul>');
      kc.scenes.forEach(function (s) { b.push('<li>' + lines(s) + '</li>'); });
      b.push('</ul></div>');
    }
    if (kc.examples && kc.examples.length) {
      b.push('<div class="kblock"><div class="lb">例句（先看对的样子）</div><ul>');
      kc.examples.forEach(function (s) { b.push('<li>' + esc(s) + '</li>'); });
      b.push('</ul></div>');
    }
    if (kc.commonMistake) b.push('<div class="kblock"><div class="lb">最容易错</div><p>' + lines(kc.commonMistake) + '</p></div>');
    if (kc.judgment) b.push('<div class="kblock"><div class="lb">判断方法</div><p>' + lines(kc.judgment) + '</p></div>');
    if (kc.memory) b.push('<div class="kblock"><div class="mem-line">' + lines(kc.memory) + '</div></div>');
    if (topic.examFlow && topic.examFlow.length) {
      b.push('<div class="kblock"><div class="lb">考场判断流程</div><ol class="ex-flow">');
      topic.examFlow.forEach(function (s) { b.push('<li>' + lines(s) + '</li>'); });
      b.push('</ol></div>');
    }
    b.push('</div>');
    return b.join('');
  }

  /* ---------- 进度条 ---------- */
  function progressBar(p, cls) {
    p = Math.max(0, Math.min(1, p));
    var c = cls || (p >= 0.9 ? 'ok' : p >= 0.6 ? '' : 'warn');
    return '<div class="pbar ' + (cls || '') + '"><i style="width:' + (p * 100) + '%"></i></div>';
  }

  /* ---------- Modal / Confirm / Toast ---------- */
  function modal(html, onClose) {
    var ov = el('div', 'overlay');
    ov.innerHTML = '<div class="sheet glass">' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    function close() { ov.remove(); if (onClose) onClose(); }
    ov.close = close;
    document.body.appendChild(ov);
    return ov;
  }
  function confirmBox(title, text, okLabel, danger) {
    return new Promise(function (res) {
      var ov = modal('<h3>' + esc(title) + '</h3><p class="muted" style="margin:8px 0 16px">' + esc(text) + '</p>'
        + '<div class="btn-row"><button class="btn ghost" data-act="no">取消</button>'
        + '<button class="btn ' + (danger ? 'danger' : 'ok') + '" data-act="yes">' + esc(okLabel || '确定') + '</button></div>');
      // 注意：不能用 $(this)——this 是元素不是选择器，会抛 SyntaxError。
      var yes = $('[data-act=yes]', ov);
      var no = $('[data-act=no]', ov);
      if (yes) yes.addEventListener('click', function () { res(true); ov.close(); });
      if (no) no.addEventListener('click', function () { res(false); ov.close(); });
    });
  }
  function toast(msg, type) {
    var t = el('div', 'fb ' + (type === 'ok' ? 'ok' : type === 'bad' ? 'bad' : ''),
      '<span class="big">' + (type === 'ok' ? '✅' : type === 'bad' ? '❌' : '📌') + '</span>' + esc(msg));
    t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;box-shadow:var(--shadow)';
    document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2200);
    setTimeout(function () { t.remove(); }, 2600);
  }

  /* ---------- 右上角"已自动保存"提示（节流：短时间内多次保存只更新一次） ---------- */
  var _saveTimer = null;
  var _saveEl = null;
  function raf(fn) { if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fn); else fn(); }
  function savedNotice() {
    if (!document || !document.body) return;
    if (!_saveEl) {
      _saveEl = el('div', 'save-notice',
        '<span style="display:inline-flex;align-items:center;gap:6px">💾 <b>已自动保存</b></span>');
      _saveEl.style.cssText = 'position:fixed;top:12px;right:14px;z-index:120;opacity:0;'
        + 'transform:translateY(-6px);transition:opacity .25s var(--ease),transform .25s var(--ease);';
      document.body.appendChild(_saveEl);
    }
    if (_saveTimer) clearTimeout(_saveTimer);
    raf(function () {
      _saveEl.style.opacity = '1';
      _saveEl.style.transform = 'translateY(0)';
    });
    _saveTimer = setTimeout(function () {
      _saveEl.style.opacity = '0';
      _saveEl.style.transform = 'translateY(-6px)';
    }, 1400);
  }

  window.EGL = window.EGL || {};
  EGL.u = {
    $: $, $$: $$, el: el, esc: esc, lines: lines, pct: pct, fmtTime: fmtTime,
    gradeOf: gradeOf, statusBadge: statusBadge, renderSentence: renderSentence,
    explanationHTML: explanationHTML, chainHTML: chainHTML, knowledgeCardHTML: knowledgeCardHTML,
    passagePanelHTML: passagePanelHTML,
    progressBar: progressBar, modal: modal, confirmBox: confirmBox, toast: toast,
    savedNotice: savedNotice
  };
})();


/* ============================================================
 * src/ai.js — AI 出题子系统（DeepSeek）
 * 职责分区：
 *   A. 配置与 API Key 管理（本地安全提示）
 *   B. 动态 Prompt 生成（buildPrompt）
 *   C. DeepSeek API 调用（唯一请求入口）
 *   D. JSON 容错与 schema 校验
 *   E. AI 题目 → 现有题库结构 转换器（语篇+逐空）
 * 规则：AI 只出题数据，不生成页面代码；失败不破坏原题库。
 * ============================================================ */
(function () {
  'use strict';
  var E = window.EGL, U = E.u;
  var $ = U.$, $$ = U.$$, el = U.el, esc = U.esc;

  var API_URL = 'https://api.deepseek.com/chat/completions';
  // UI 显示名与真实 API model id 映射（避免硬编码不存在的 id）
  var MODELS = [
    { ui: 'DeepSeek V4 Flash（默认·快）', id: 'deepseek-chat', note: '对应 deepseek-chat' },
    { ui: 'DeepSeek Reasoner（强推理·更慢更贵）', id: 'deepseek-reasoner', note: '对应 deepseek-reasoner' }
  ];
  // 推理等级：本 API 无独立 reasoning 参数，用模型选择映射；不发送不存在的参数
  var REASON = { low: 'deepseek-chat', medium: 'deepseek-chat', high: 'deepseek-reasoner' };

  // 真实 model id：优先用 UI 显式选择的模型，其次按推理等级映射（不发送不存在的参数）
  function modelIdOf(cfg) {
    var want = cfg && cfg.modelUi;
    for (var i = 0; i < MODELS.length; i++) if (MODELS[i].ui === want) return MODELS[i].id;
    return REASON[cfg && cfg.reasoning] || REASON.low;
  }

  var KEY_LS = 'EGL_AI_KEY_v1';
  var LAST_SESSION_LS = 'EGL_AI_LAST_v1'; // 结果缓存：sessionStorage 优先

  function getKey() {
    try { return localStorage.getItem(KEY_LS) || ''; } catch (e) { return ''; }
  }
  function saveKey(k, remember) {
    try {
      if (remember && k) localStorage.setItem(KEY_LS, k);
      else localStorage.removeItem(KEY_LS);
    } catch (e) {}
  }
  function clearKey() { try { localStorage.removeItem(KEY_LS); } catch (e) {} }

  function cacheSession(obj) {
    try { sessionStorage.setItem(LAST_SESSION_LS, JSON.stringify(obj)); } catch (e) {}
  }
  function readCachedSession() {
    try { var r = sessionStorage.getItem(LAST_SESSION_LS); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function clearCachedSession() { try { sessionStorage.removeItem(LAST_SESSION_LS); } catch (e) {} }

  /* ---------- AI 生成记录池（持久保存，未做完也可继续；可删除/清空） ---------- */
  var POOL_LS = 'EGL_AI_POOL_v1';
  var POOL_MAX = 20;               // 最多保留条数
  var POOL_BYTES = 1200000;        // 单文件总容量上限约 1.2MB（留出 localStorage 余量）
  function poolKey() { return POOL_LS; }
  function getPool() {
    try {
      var r = localStorage.getItem(POOL_LS);
      if (!r) return [];
      var a = JSON.parse(r);
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  // 精简存档：去掉 cfg 里的 apiKey，避免把密钥写入本地记录
  function sanitizeCfg(cfg) {
    var c = {};
    if (!cfg) return c;
    ['gradeKey', 'gradeName', 'stage', 'topicId', 'count', 'customCount', 'reasoning', 'qtype', 'structure', 'mode'].forEach(function (k) {
      if (cfg[k] !== undefined) c[k] = cfg[k];
    });
    return c;
  }
  // 生成完成即入池（不管是否做完）
  function pushToPool(papers, questions, cfg, meta) {
    var list = getPool();
    var entry = {
      id: 'ai_' + nowId(),
      ts: nowTs(),
      date: todayStr(),
      gradeName: meta && meta.gradeName ? meta.gradeName : (cfg.gradeName || ''),
      topicLabel: meta && meta.title ? meta.title : '',
      count: (papers || []).reduce(function (s, p) { return s + (p.blanks ? p.blanks.length : 0); }, 0),
      papersCount: (papers || []).length,
      cfg: sanitizeCfg(cfg),
      meta: { title: (meta && meta.title) || 'AI 出题', gradeName: (meta && meta.gradeName) || (cfg.gradeName || '') },
      papers: papers,       // 语篇原文（保留 blanks，便于以后转存题库/重排）
      questions: questions  // 已转换的题目，可直接进入做题
    };
    list.unshift(entry);
    // 容量裁剪：先按数量，再按字节
    if (list.length > POOL_MAX) list.length = POOL_MAX;
    var ok = false;
    try {
      var raw = JSON.stringify(list);
      while (raw.length > POOL_BYTES && list.length > 1) {
        list.pop();
        raw = JSON.stringify(list);
      }
      localStorage.setItem(POOL_LS, raw);
      ok = true;
    } catch (e) { ok = false; }
    return ok ? entry : null;
  }
  function removeFromPool(id) {
    var list = getPool().filter(function (e) { return e.id !== id; });
    try { localStorage.setItem(POOL_LS, JSON.stringify(list)); } catch (e) {}
    return list;
  }
  function clearPool() { try { localStorage.removeItem(POOL_LS); } catch (e) {} }
  var _idSeq = 0;
  function nowId() {
    _idSeq = (_idSeq + 1) % 100000;
    return String(Date.now()) + '_' + _idSeq;
  }
  function nowTs() { return Date.now(); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- Prompt 规则文本（稳定部分，动态部分在 buildPrompt 拼接） ---------- */

      g2: '高二（真正高中综合）：句子变长、允许从句与结构嵌套。有提示词加入过去完成、时态语态综合、上下文时态、having done/to have done/being done/to be done、非谓语作定语状语、比较级最高级、否定前缀；无提示词加入三大从句综合、what/that、however让步、介词语义、抽象名词具体化等。重点训练拆句子主干。',
      g3: '高三（完全综合冲刺，对标春考/秋考/一模/二模）：全时态全语态、隐蔽主谓一致、全套非谓语含完成被动式、复杂词性转换；无提示词做三大从句深度综合、从句嵌套、what/that/whose/where、复杂介词、抽象名词具体化、代词指代、并列逻辑。即使单句看懂也不一定做对，必须结合全文逻辑。'
    };
    return map[gradeKey] || map.g1;

          : '以时态、基础非谓语、简单词性转换、基础从句与虚词为主体，按上海实际重要程度分配，不要机械均分。';

  /* ---------- DeepSeek 调用（唯一入口） ---------- */
  function callDeepSeek(promptText, cfg) {
    var key = cfg.apiKey || getKey();
    if (!key) return Promise.reject({ code: 'NO_KEY', msg: '请先输入 DeepSeek API Key。' });
    var modelId = modelIdOf(cfg);
    var body = {
      model: modelId,
      messages: [
        { role: 'system', content: '你是英语语法填空命题引擎（上海命题风格 · 初高中通用）。只输出严格合法的 JSON，不要输出任何解释文字、Markdown 或代码围栏。' },
        { role: 'user', content: promptText }
      ],
      temperature: 0.7,
      stream: false
    };
    var ctrl = null;
    if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); }
    var timeoutMs = 90000;
    var timer = null;
    if (ctrl) timer = setTimeout(function () { ctrl.abort(); }, timeoutMs);
    return fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (resp) {
      if (timer) clearTimeout(timer);
      if (!resp.ok) {
        if (resp.status === 401) throw { code: 'BAD_KEY', msg: 'DeepSeek API Key 无效，请检查后重试。' };
        if (resp.status === 429) throw { code: 'RATE', msg: '请求太频繁或余额不足，稍后再试。' };
        throw { code: 'HTTP_' + resp.status, msg: 'API 返回错误（' + resp.status + '），请重试。' };
      }
      return resp.json();
    }).then(function (json) {
      var txt = '';
      try {
        txt = json.choices && json.choices[0] && (json.choices[0].message.content || '');
      } catch (e) { txt = ''; }
      if (!txt) throw { code: 'EMPTY', msg: 'AI 返回内容为空，请重试。' };
      return txt;
    }).catch(function (err) {
      if (timer) clearTimeout(timer);
      if (err && err.code) throw err;
      if (err && err.name === 'AbortError') throw { code: 'TIMEOUT', msg: '请求超时，请重试。' };
      throw { code: 'NET', msg: '网络请求失败，请检查网络连接后重试。' };
    });
  }

  /* ---------- JSON 容错提取 ---------- */
  function extractJSON(text) {
    var t = String(text || '').trim();
    // 去掉 ```json ... ``` 围栏
    var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) t = fence[1].trim();
    // 尝试直接解析
    try { return JSON.parse(t); } catch (e1) {}
    // 提取第一个 { ... } 或 [ ... ] 平衡块
    var start = t.indexOf('{');
    var arrStart = t.indexOf('[');
    if (arrStart >= 0 && (start < 0 || arrStart < start)) start = arrStart;
    if (start < 0) throw { code: 'JSON', msg: 'AI 返回的 JSON 解析失败，请重试。' };
    var depth = 0, inStr = false, escCh = false, end = -1;
    for (var i = start; i < t.length; i++) {
      var ch = t[i];
      if (inStr) {
        if (escCh) escCh = false;
        else if (ch === '\\') escCh = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') inStr = true;
      else if (ch === '{' || ch === '[') depth++;
      else if (ch === '}' || ch === ']') {
        depth--;
        if (depth === 0) { end = i; break; }
      }
    }
    if (end < 0) throw { code: 'JSON', msg: 'AI 返回内容不完整，请重试。' };
    try { return JSON.parse(t.slice(start, end + 1)); } catch (e2) { throw { code: 'JSON', msg: 'AI 返回的 JSON 解析失败，请重试。' }; }
  }

  /* ---------- schema 校验 + 规范化（§四十八） ---------- */
  function validateAndNormalize(raw, cfg) {
    var countWant = cfg.count || 10;
    if (!raw || typeof raw !== 'object') throw { code: 'SCHEMA', msg: 'AI 返回的数据格式异常，请重试。' };
    var catName = '其他/拓展';
    var cur = window.__EGL_CURRICULUM__;
    if (cfg.topicId && cfg.topicId !== 'all') {
      var c = cur && cur.category ? cur.category(cfg.topicId) : null;
      catName = c ? c.name : cfg.topicId;
    }
    function normBlanks(list) {
      var out = [];
      (list || []).forEach(function (b, bi) {
        if (!b || !b.answer) return;
        var isG = !!b.isGivenWord || (b.givenWord != null && String(b.givenWord) !== '' && b.givenWord !== 'null');
        var ansRaw = String(b.answer).trim();
        var ansLower = ansRaw.toLowerCase();
        out.push({
          n: bi + 1,
          answer: ansLower,
          answerRaw: ansRaw,
          options: normalizeOptions(b.options, ansRaw, ansLower),
          givenWord: isG ? String(b.givenWord != null ? b.givenWord : '') : '',
          isGivenWord: isG,
          type: b.type || 'other',
          knowledgePoint: b.knowledgePoint || '',
          category: b.category || catName,
          explanation: b.explanation || '（本题缺解析）',
          difficulty: (b.difficulty >= 1 && b.difficulty <= 5) ? b.difficulty : 1
        });
      });
      return out;
    }
    var sections = [];
    var total = 0;
    // 单句部分（先出，仿作业：句子在前）
    if (raw.sentences && Array.isArray(raw.sentences) && raw.sentences.length) {
      raw.sentences.forEach(function (s, si) {
        if (!s || !s.sentence || !Array.isArray(s.blanks) || !s.blanks.length) return;
        var blanks = normBlanks(s.blanks);
        if (!blanks.length) return;
        var passage = markPassage(String(s.sentence || ''), blanks);
        sections.push({ kind: 'sentence', title: s.title || ('单句 ' + (si + 1)), passage: passage, blanks: blanks });
        total += blanks.length;
      });
    }
    // 语篇部分
    var papers = raw.papers || (Array.isArray(raw) ? raw : null);
    if (papers && papers.length) {
      papers.forEach(function (p, pi) {
        if (!p || !p.passage || !Array.isArray(p.blanks) || !p.blanks.length) return;
        var blanks = normBlanks(p.blanks);
        if (!blanks.length) return;
        // 若 AI 把答案写进了正文（无下划线），按 blanks 顺序重建空位
        var passage = markPassage(String(p.passage || ''), blanks);
        sections.push({ kind: 'passage', title: p.title || ('语篇 ' + (pi + 1)), passage: passage, blanks: blanks });
        total += blanks.length;
      });
    }
    if (!sections.length) throw { code: 'SCHEMA', msg: 'AI 生成结果缺少有效题目，请重试。' };
    if (total < Math.min(countWant, 5)) throw { code: 'COUNT', msg: 'AI 生成的题目数量不足（' + total + '），请重试。' };
    return sections;
  }

  // 兜底：AI 正文没写空标时，按 blank 顺序把答案词原位替换成 ______，重建带空位的全文
  function markPassage(passage, blanks) {
    if (/_{4,}/.test(passage)) return passage; // 已有空标则不动
    var s = String(passage);
    var pos = 0;
    blanks.forEach(function (b) {
      var ans = String(b.answerRaw || b.answer || '').trim();
      if (!ans) return;
      var esc = ans.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // 优先整词匹配（避免答案嵌在其它词里，如 strengthen 在 strengthened 里）
      var re = new RegExp('\\b' + esc + '\\b', 'i');
      var m = re.exec(s.slice(pos));
      var st = m ? pos + m.index : -1;
      if (st < 0) { re.lastIndex = 0; var m2 = re.exec(s); st = m2 ? m2.index : -1; }
      if (st < 0) return;
      s = s.slice(0, st) + '______' + s.slice(st + ans.length);
      pos = st + 6;
    });
    return s;
  }

  // options 规范化：去重(忽略大小写与首尾空格)，保证正确项在内，最多保留 6 项
  function normalizeOptions(list, ansRaw, ansLower) {
    if (!Array.isArray(list) || !list.length) return null;
    var seen = {};
    var out = [];
    for (var i = 0; i < list.length && out.length < 8; i++) {
      var s = String(list[i] == null ? '' : list[i]).trim();
      if (!s) continue;
      var low = s.toLowerCase();
      if (seen[low]) continue;
      seen[low] = true;
      out.push(s);
    }
    var has = out.some(function (o) { return o.toLowerCase() === ansLower; });
    if (!has) out.unshift(ansRaw);
    // 超过 6 个时裁到 6 个，并保证正确项一定保留
    if (out.length > 6) {
      var ansIdx = -1;
      for (var j = 0; j < out.length; j++) if (out[j].toLowerCase() === ansLower) { ansIdx = j; break; }
      var keep = out.slice(0, 6);
      if (ansIdx >= 6) keep[5] = out[ansIdx];
      out = keep;
    }
    return out;
  }

  /* ---------- AI 题 → 现有题目结构 转换器 ----------
   * 每个空 → 一条 input 题（保留语篇上下文 ctx，供做题界面顶部展示整篇）
   * 复用现有做题/判分/解析/错题 schema（type:'input' + accepted + answerText + explanation）
   */
  // 从整篇 passage 截取“第 n 个空所在句”的上下文片段：只取该空所在的句子，
  // 避免把文章后半段/其它空的句子卷进来；其它空保留为下划线。
  function excerptAround(passage, blankN) {
    var text = String(passage || '');
    var re = /_{4,}/g, m, marks = [];
    while ((m = re.exec(text))) marks.push({ i: m.index, len: m[0].length });
    if (!marks.length) return '(语篇第' + blankN + '空) ______';
    var nth = marks[blankN - 1] || marks[marks.length - 1];
    // 句首：向前找到上一个句末标点（. ? !），否则从全文开头
    var start = 0;
    for (var k = nth.i - 1; k >= 0; k--) {
      var ch = text[k];
      if (ch === '.' || ch === '!' || ch === '?') { start = k + 1; while (start < text.length && (text[start] === ' ' || text[start] === '\n')) start++; break; }
    }
    // 句尾：向后到下一个句末标点（含标点）
    var end = nth.i + nth.len;
    for (var j = nth.i + nth.len; j < text.length; j++) {
      var c2 = text[j];
      if (c2 === '.' || c2 === '!' || c2 === '?') { end = j + 1; break; }
    }
    var s = text.slice(start, end);
    // 当前空统一替换成 6 下划线（相对位置由全局偏移换算）
    var rel = nth.i - start;
    if (rel >= 0 && rel + nth.len <= s.length && /_{4,}/.test(s.slice(rel, rel + nth.len))) {
      s = s.slice(0, rel) + '______' + s.slice(rel + nth.len);
    }
    return s.replace(/\s+/g, ' ').trim() || ('(语篇第' + blankN + '空) ______');
  }

  function papersToQuestions(sections, cfg) {
    var qs = [];
    var idx = 0;
    // 每次生成一个唯一 genId：避免不同批次/不同内容生成出相同 qid（错题本按 qid 去重会误合并）
    var genId = cfg.genId || nowId();
    var wantChoice = cfg.qtype !== 'input';
    var fallbackCount = 0;
    var cur = window.__EGL_CURRICULUM__;
    function catIdOfName(name) {
      if (!cur || !cur.categories) return 'verb';
      var key = String(name || '').trim();
      for (var i = 0; i < cur.categories.length; i++) {
        if (cur.categories[i].name === key || cur.categories[i].id === key) return cur.categories[i].id;
      }
      return 'verb';
    }
    (sections || []).forEach(function (p, pi) {
      var kind = p.kind === 'sentence' ? 'sentence' : 'passage';
      (p.blanks || []).forEach(function (b) {
        idx++;
        var isG = b.isGivenWord;
        var catName = b.category || '其他/拓展';
        var ctx = {
          kind: kind,
          isSentence: kind === 'sentence',
          paperIndex: pi, paperCount: (sections || []).length,
          title: p.title || (kind === 'sentence' ? ('单句 ' + (pi + 1)) : ('语篇 ' + (pi + 1))),
          passage: p.passage, total: (p.blanks || []).length,
          blankN: b.n, given: isG ? b.givenWord : ''
        };
        var excerpt = excerptAround(p.passage, b.n);
        // 选择题：空后面带提示词时把词放进题干（如 ______ (build)）
        var stem = excerpt;
        var hasOpts = wantChoice && Array.isArray(b.options) && b.options.length >= 2;
        if (hasOpts && isG && b.givenWord) {
          // 若句子/语篇里 AI 已内联了该原词（如 ______ (play)），则不再重复追加，避免“双份提示词”
          var gwParen = '(' + b.givenWord + ')';
          if (String(stem).toLowerCase().indexOf(gwParen.toLowerCase()) < 0) {
            stem = stem.replace('______', '______ ' + gwParen);
          }
        }
        var q = {
          id: 'ai_' + (cfg.gradeKey || 'g1') + '_' + genId + '_' + kind.slice(0, 1) + pi + '_b' + (b.n || idx),
          source: 'ai',
          isAI: true,
          aiMeta: {
            gradeKey: cfg.gradeKey, gradeName: cfg.gradeName,
            stage: cfg.stage, topicId: cfg.topicId === 'all' ? 'all' : (cfg.topicId || 'all'),
            catName: catName, catId: catIdOfName(catName),
            knowledgePoint: b.knowledgePoint || '', type: b.type || ''
          },
          aiCtx: ctx,
          difficulty: b.difficulty || 1,
          question: stem,
          tag: b.knowledgePoint || (b.category || ''),
          wrongType: 'CONTEXT_ERROR',
          explanation: {
            answer: b.answerRaw || b.answer,
            keyPoint: b.knowledgePoint ? '考点：' + b.knowledgePoint : '考点：' + (b.category || '语法'),
            clue: (kind === 'sentence'
              ? '本题为单句题《' + ctx.title + '》，注意句中的时间状语/语境线索。'
              : '本题来自语篇《' + p.title + '》第' + (b.n || idx) + '空；判断请结合前后文与所在句结构。'),
            chain: (kind === 'sentence' ? '读全句找线索 → 判断该动词时态/语态/形式 → ' : '读语篇 → 看所在句结构 → ')
              + (b.knowledgePoint || '判断该空作用') + ' → ' + (b.answerRaw || b.answer),
            why: b.explanation || '（AI 未提供解析）',
            whyOthers: hasOpts
              ? '其它选项是该考点常见易错干扰项：或时态/语态/词形不对，或不符合句子成分/上下文逻辑；用排除法逐条对照主干再定。'
              : '（AI 生成题无固定选项；易错点是填入其它语法形式，详见上方解析。）',
            commonError: '上海卷此考点常见错误：只背规则不看语境；做题时请先找时间状语/语境线索，再定时态语态。',
            memory: '',
            cue: '',
            examMind: ''
          }
        };
        if (hasOpts) {
          // n 选 1：正确项必须在 options 中（normalizeOptions 已保证）
          var ansLow = String(b.answer || '').toLowerCase();
          var ansIdx = -1;
          for (var oi = 0; oi < b.options.length; oi++) {
            if (String(b.options[oi]).toLowerCase() === ansLow) { ansIdx = oi; break; }
          }
          if (ansIdx < 0) ansIdx = 0;
          q.type = 'choice';
          q.options = b.options.slice();
          q.answerIndex = ansIdx;
          q.answerText = b.options[ansIdx];
          q.accepted = [b.options[ansIdx]];
          q.hint = '';
        } else {
          // 兜底：AI 没给选项 → 仍按填空呈现，并在完成页提示
          if (wantChoice) fallbackCount++;
          q.type = 'input';
          q.hint = isG ? String(b.givenWord) : '';
          q.accepted = [b.answerRaw || b.answer];
          q.answerText = b.answerRaw || b.answer;
          q._fallbackInput = wantChoice;
        }
        qs.push(q);
      });
    });
    if (qs.length) qs.fallbackCount = fallbackCount;
    return qs;
  }

  /* ---------- 配置面板默认值 ---------- */
  function defaultConfig() {
    return {

  function allCoreFinished() {

  function loadGrade() {
    try { var g = localStorage.getItem('EGL_GRADE'); if (g) return g; } catch (e) {}
    return 'g1'; // 高一默认
  }

  // 该大专题下：当前有真实题库且属于本年级使用的专题
  function availableOfCat(catId, gradeKey) {
    var out = [];
    E.availableTopicIds().forEach(function (tid) {
      var no = tid.replace('tense', '');
      var cur = window.__EGL_CURRICULUM__;
      var e = cur && cur.catOf ? cur.catOf(no) : null;
      if (!e || e.cat !== catId) return;
      var grades = e.grades || [];
      if (gradeKey && grades.indexOf(gradeKey) < 0) return; // 未列入该年级 → 不放行
      out.push({ tid: tid, no: no, title: (E.metaOfTopic(tid) || {}).title || tid });
    });
    out.sort(function (a, b) { return a.no.localeCompare(b.no); });
    return out;
  }

  function weak() {
    var v = app.view;
    v.innerHTML = '';
    v.appendChild(U.el('div', '', '<div class="page-title"><span class="ico">🎯</span>我的薄弱点分析</div>'

    // 专题级
    var weakT = E.weakTopics().filter(function (t) { return t.pct < 0.9; });
    if (weakT.length) {
      v.appendChild(U.el('div', 'sec-title', '专题正确率（由低到高）'));
      var c1 = U.el('div', 'glass', '');
      c1.style.padding = '10px 16px';
      weakT.forEach(function (t) {
        var row = U.el('div', 'bar-row');
        row.innerHTML = '<span class="nm">' + (t.meta && t.meta.icon ? t.meta.icon : '📘') + ' ' + esc(t.meta ? t.meta.title : t.id) + '</span>'
          + '<div class="tr">' + U.progressBar(t.pct, t.pct < 0.6 ? 'bad' : '') + '</div>'
          + '<span class="pct" style="color:' + (t.pct < 0.6 ? 'var(--bad)' : t.pct < 0.8 ? 'var(--warn)' : 'var(--ok)') + '">' + pct(t.pct) + '</span>';
        c1.appendChild(row);
      });
      v.appendChild(c1);
    }

    // tag 级
    var tags = E.tagList().filter(function (t) { return t.attempts >= 2; });
    tags.sort(function (a, b) { return (a.pct === null ? 1 : a.pct) - (b.pct === null ? 1 : b.pct); });
    if (tags.length) {
      v.appendChild(U.el('div', 'sec-title', '易错知识点（雷区细看）'));
      var c2 = U.el('div', 'glass', '');
      c2.style.padding = '10px 16px';
      tags.forEach(function (t) {
        var row = U.el('div', 'risk-row');
        var red = t.streakWrong >= 3;
        var color = t.pct === null ? 'var(--ink-faint)' : t.pct >= 0.8 ? 'var(--ok)' : t.pct >= 0.6 ? 'var(--warn)' : 'var(--bad)';
        row.innerHTML = '<span>' + esc(topicName(t.topicId)) + '</span>'
          + '<span class="faint small">· ' + esc(t.tag) + (red ? ' <b style="color:var(--bad)">连续错' + t.streakWrong + '次</b>' : '') + '</span>'
          + '<span class="pct" style="color:' + color + '">' + (t.pct === null ? '—' : pct(t.pct)) + '</span>'
          + '<button class="btn sm ghost" data-train="1" data-tid="' + t.topicId + '" data-tag="' + esc(t.tag) + '">针对性 5 题</button>';
        c2.appendChild(row);
      });
      v.appendChild(c2);
      $$('[data-train]', c2).forEach(function (b) {
        b.addEventListener('click', function () {
          startRetrain(b.dataset.tid, b.dataset.tag);
        });
      });
    }

    // 错误类型分布
    var errKeys = Object.keys(E.data.errorTypes);
    if (errKeys.length) {
      v.appendChild(U.el('div', 'sec-title', '错误类型分布'));
      var c3 = U.el('div', 'glass', '');
      c3.style.padding = '10px 16px';
      var total = 0;
      errKeys.forEach(function (k) { total += E.data.errorTypes[k]; });
      errKeys.forEach(function (k) {
        var n = E.data.errorTypes[k];
        var row = U.el('div', 'bar-row');
        row.innerHTML = '<span class="nm">' + esc(wtZh(k)) + '</span>'
          + '<div class="tr">' + U.progressBar(n / total, n / total > 0.35 ? 'bad' : '') + '</div>'
          + '<span class="pct">' + n + '</span>';
        c3.appendChild(row);
      });
      v.appendChild(c3);

          var gw = (it && it.q && it.q.aiCtx && it.q.aiCtx.given) || '';
          var after = (parts[i + 1] || '');
          var inline = gw && after.trim().toLowerCase().indexOf('(' + gw.toLowerCase() + ')') === 0;
          out.push('<span class="passage-blank">(' + bi + ')______'
            + (gw && !inline ? ' (' + esc(gw) + ')' : '') + '</span>');
        } else {
          out.push(esc(parts[i]).replace(/\n/g, '<br>'));
        }
      }
      return out.join('');
    }
    function renderSentenceCard(g) {
      var card = el('div', 'sq-card');
      card.style.marginTop = '10px';
      var k = g.items.length;
      var h = el('div', 'sq-head');
      h.innerHTML = '<span class="badge green">单句' + (k > 1 ? ' · 共 ' + k + ' 空' : '') + '</span>'
        + (k > 1 ? ' <span class="badge gray">每空一排选项</span>' : '');
      card.appendChild(h);
      var stem = el('div', 'sq-stem');
      stem.style.cssText = 'font-size:15px;line-height:1.9;margin-top:8px;color:var(--ink-dim)';
      stem.innerHTML = sentenceDisplayHTML(g);
      card.appendChild(stem);
      g.items.forEach(function (it, bIdx) {
        var q = it.q;
        var n = (q.aiCtx && q.aiCtx.blankN) || (bIdx + 1);
        var sub = el('div', 'sq-blank-row');
        sub.style.marginTop = (bIdx === 0 ? '10px' : '12px');
        sub.dataset.qrow = String(it.i); // 供 pickSheet 定位并高亮本空所选选项
        var lbl = el('div', '');
        lbl.style.cssText = 'font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:800;letter-spacing:.5px';
        lbl.textContent = k > 1 ? '第 ' + n + ' 空（' + LETTERS[0] + '—' + LETTERS[q.options ? q.options.length - 1 : 0] + '）' : '';
        if (lbl.textContent) sub.appendChild(lbl);
        if (q.type === 'choice' && q.options) {
          var row = el('div', 'sq-opts');
          q.options.forEach(function (txt, oi) {
            var b = el('button', 'sq-opt');
            b.type = 'button';
            b.dataset.idx = String(oi);
            b.innerHTML = '<b>' + LETTERS[oi] + '</b><span>' + esc(txt) + '</span>';
            (function (qidx, oi2) {
              b.addEventListener('click', function () { pickSheet(qidx, oi2); });
            })(it.i, oi);
            row.appendChild(b);
          });
          sub.appendChild(row);
        } else {
          var ai = el('div', 'answer-input');
          ai.style.marginTop = '6px';
          ai.innerHTML = '<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入该空答案">';
          var inp = $('input', ai);
          (function (qidx) {
            inp.addEventListener('input', function () { S._typed[qidx] = inp.value; updateSheetMeta(); });
            inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitSheet(); });
          })(it.i);
          sub.appendChild(ai);
        }
        card.appendChild(sub);
      });
      return card;
    }

    function renderPassageBlock(g, gIdx, headIcon, headLabel) {
      var paper = el('div', 'passage-panel sheet-paper sheet-paper-top');
      paper.style.marginTop = (gIdx === 0 ? '12px' : '16px');
      var t = el('div', 'passage-title', headIcon + ' ' + esc(g.ctx.title || (headLabel + ' ' + (gIdx + 1)))
        + ' <span class="faint small" style="font-weight:500">本区固定顶部 · 通读后在下方作答</span>');
      paper.appendChild(t);
      paper.appendChild(el('div', '', sheetPassageHTML(g.ctx)));
      v.appendChild(paper);
      v.appendChild(renderCards(g));
    }

    // 单句：每句一次展示 + 每空一排选项（一句两空 → 第一排第1空、第二排第2空）
    sentGroups.forEach(function (g) { if (g) v.appendChild(renderSentenceCard(g)); });
    // 语篇：文章固定顶部 + 各空卡片
    passGroups.forEach(function (g, gIdx) { if (g) renderPassageBlock(g, gIdx, '📄', '语篇'); });

    var act = el('div', 'btn-row');
    act.style.cssText = 'position:sticky;bottom:12px;margin-top:16px';
    var sub = el('button', 'btn block', '✅ 全部答完，交卷看成绩');
    sub.id = 'sheetSubmit';
    sub.type = 'button';
    sub.addEventListener('click', submitSheet);
    act.appendChild(sub);
    v.appendChild(act);
    v.scrollIntoView({ block: 'start' });
  }

  function pickSheet(qidx, oi) {
    if (!S) return;
    var q = S.questions[qidx];
    if (!q) return;
    var entry = { qid: q.id, q: q, userText: q.options[oi], ok: oi === q.answerIndex, answerIndex: oi };
    S.answers[qidx] = entry;
    var v = appView();
    if (v) {
      $$('[data-qrow="' + qidx + '"] .sq-opt', v).forEach(function (x) {
        x.classList.toggle('sel', Number(x.dataset.idx) === oi);
      });
    }
    updateSheetMeta();
  }
  function updateSheetMeta() {
    if (!S) return;
    var answered = S.answers.filter(function (a) { return !!a; }).length;
    var elC = $('#sheetCount', appView());
    if (elC) elC.textContent = answered + ' / ' + S.questions.length;
    var sub = $('#sheetSubmit', appView());
    if (sub) sub.textContent = answered === S.questions.length
      ? '✅ 已全部作答（' + answered + '/' + S.questions.length + '），交卷看成绩'
      : '✅ 已作答 ' + answered + '/' + S.questions.length + '，交卷';
  }
  function submitSheet() {
    if (!S) return;
    // 兜底填空输入：把已输入的文本补成条目
    S.questions.forEach(function (q, i) {
      if (!S.answers[i] && q.type !== 'choice' && S._typed && S._typed[i] && String(S._typed[i]).trim()) {
        var t = String(S._typed[i]).trim();
        S.answers[i] = { qid: q.id, q: q, userText: t, ok: E.util.checkInputAnswer(t, q.accepted), answerIndex: undefined };
      }
    });
    var missingIdx = -1;
    S.questions.forEach(function (q, i) {
      if (!S.answers[i] && missingIdx < 0) missingIdx = i;
    });
    if (missingIdx >= 0) {
      var nums = [];
      S.questions.forEach(function (q, i) { if (!S.answers[i]) nums.push((q.aiCtx && q.aiCtx.blankN) || (i + 1)); });
      var shown = nums.slice(0, 6).join('、');
      U.toast('还有 ' + nums.length + ' 空未作答（' + shown + (nums.length > 6 ? '…' : '') + '）', 'bad');
      var v = appView();
      if (v) {
        var card = $('[data-qrow="' + missingIdx + '"]', v);
        if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center' });
      }
      return;
    }
    // 全部答完 → 统计落库 + 出成绩（成绩页含逐空回顾与解析）
    S.questions.forEach(function (q, i) {
      if (S.answers[i]) commitStats(q, S.answers[i]);
    });
    finish();
  }

  /* 选择题作答区（未答） */
  function renderChoiceInput(qbox, q) {
    var sel = -1;
    var opts = el('div', 'opts');
    q.options.forEach(function (text, i) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.innerHTML = '<span class="L">' + LETTERS[i] + '</span><span>' + esc(text) + '</span>';
      b.addEventListener('click', function () {
        $$('.opt', opts).forEach(function (x, j) { x.classList.toggle('sel', j === i); });
        sel = i;
      });
      opts.appendChild(b);
    });
    qbox.appendChild(opts);

    var act = el('div', 'act-row');
    var sub = el('button', 'btn', S.mode === 'blind' ? (lastQ() ? '交卷' : '下一题 →') : '提交答案');
    sub.type = 'button';
    act.appendChild(sub);
    qbox.appendChild(act);
    sub.addEventListener('click', function () {
      if (sel < 0) { U.toast('请先选择一个答案', 'bad'); return; }
      finishAnswer(q, { answerIndex: sel });
    });
  }

  /* 输入题作答区（未答）——支持“有提示词 / 无提示词(纯逻辑填空)”两种 */
  function renderTextInput(qbox, q) {
    var hasHint = !!(q.hint && String(q.hint).trim());
    // 考点 + 填空类型徽章
    var grammarName = (E.bank()[S.topicId] && E.bank()[S.topicId].title) || '';
    var typeLine = el('div', 'qno', '');
    typeLine.style.marginTop = '12px';
    typeLine.innerHTML = '<span class="badge badge-grammar">考点：' + esc(grammarName) + '</span>'
      + (hasHint
        ? ' <span class="badge gray">提示词题 · 结合括号词变形</span>'
        : ' <span class="badge amber">纯逻辑填空 · 介/连/冠/代，无提示词</span>');
    qbox.appendChild(typeLine);

    var row = el('div', 'answer-row');
    var ai = el('div', 'answer-input');
    ai.style.flex = '1';
    ai.style.minWidth = '0';
    ai.innerHTML = '<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"'
      + (hasHint ? '' : ' style="color:var(--warn)"')
      + ' placeholder="' + (hasHint ? '输入变形后的答案，如 was working' : '直接填介/连/冠词等') + '">';
    var inp = $('input', ai);
    row.appendChild(ai);
    if (hasHint) {
      // 提示词字卡：置于输入框右侧
      var hw = el('span', 'hint-word', '(' + esc(String(q.hint).trim()) + ')');
      row.appendChild(hw);
    }
    qbox.appendChild(row);

    var act = el('div', 'act-row');
    var sub = el('button', 'btn', S.mode === 'blind' ? (lastQ() ? '交卷' : '下一题 →') : '提交');
    sub.type = 'button';
    act.appendChild(sub);
    qbox.appendChild(act);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') sub.click(); });
    sub.addEventListener('click', function () {
      var val = inp.value.trim();
      if (!val) { U.toast('先输入你的答案再提交', 'bad'); return; }
      finishAnswer(q, { userText: val });
    });
  }

  /* 统一收答案：判对错 → 记库 → 普通模式展示反馈/盲做直接前进 */
  function finishAnswer(q, res) {
    var ok, userText, answerIndex;
    if (res.answerIndex !== undefined) {
      answerIndex = res.answerIndex;
      ok = answerIndex === q.answerIndex;
      userText = q.options[answerIndex];
    } else {
      userText = res.userText;
      ok = E.util.checkInputAnswer(userText, q.accepted);
    }
    var entry = { qid: q.id, q: q, userText: userText, ok: ok, answerIndex: answerIndex };
    S.answers[S.idx] = entry;
    commitStats(q, entry);

    if (S.mode === 'blind') {
      if (lastQ()) finish();
      else { S.idx++; renderPractice(); }
    } else {
      // 普通模式：显示反馈 + 解析（默认折叠） + 下一题
      var qbox = appView().querySelector('.qbox');
      // 清理旧的作答控件（输入框 / 提交按钮行），避免残留
      $$('.answer-input', qbox).forEach(function (n) { n.remove(); });
      $$('.act-row', qbox).forEach(function (n) { n.remove(); });
      if (q.type === 'choice') {
        markOptionsRightWrong(qbox, q, answerIndex, ok);
        var fb = el('div', 'fb ' + (ok ? 'ok' : 'bad'));
        fb.innerHTML = ok ? '<span class="big">✅</span>回答正确！' : '<span class="big">❌</span>再想一想…然后看解析记规律';
        qbox.appendChild(fb);
      } else {
        var fb2 = el('div', 'fb ' + (ok ? 'ok' : 'bad'));
        fb2.innerHTML = ok ? '<span class="big">✅</span>回答正确！' : '<span class="big">❌</span>再想一想…然后看解析记规律';
        qbox.appendChild(fb2);
        var ai = el('div', 'answer-input');
        ai.innerHTML = '<input type="text" disabled value="' + esc(userText) + '">';
        qbox.appendChild(ai);
      }
      appendAnalysis(qbox, q, entry);
      var act = el('div', 'act-row');
      var nx = el('button', 'btn ' + (lastQ() ? 'ok' : ''), lastQ() ? '🏁 查看成绩' : '下一题 →');
      nx.type = 'button';
      nx.addEventListener('click', function () {
        if (lastQ()) finish(); else { S.idx++; renderPractice(); }
      });
      act.appendChild(nx);
      qbox.appendChild(act);
    }
  }

  // 标记选项对错：答错时不亮出正确项（保留在解析里），只标红所选
  function markOptionsRightWrong(qbox, q, myIdx, ok) {
    var opts = qbox.querySelector('.opts');
    if (opts) opts.innerHTML = '';
    var container = opts || el('div', 'opts');
    if (!opts) qbox.appendChild(container);
    q.options.forEach(function (text, i) {
      var cls = 'opt';
      if (ok) {
        if (i === q.answerIndex) cls += ' right';
        else cls += ' dim';
      } else {
        if (i === myIdx) cls += ' wrong';
        else cls += ' dim';
      }
      var b = el('div', cls);
      b.innerHTML = '<span class="L">' + LETTERS[i] + '</span><span>' + esc(text) + '</span>';
      container.appendChild(b);
    });
  }

  function appendAnalysis(qbox, q, entry) {
    var corText = q.type === 'choice' ? q.options[q.answerIndex] : (q.answerText || (q.accepted && q.accepted[0]));
    var det = el('details', 'qa explanation-panel');
    // 考点名：AI 题用其大专题，普通题用专题语法点
    var isAI = !!(q.isAI || q.source === 'ai');
    var grammarName = isAI ? ((q.aiMeta && q.aiMeta.catName) || 'AI出题')
      : ((E.bank()[S.topicId] && E.bank()[S.topicId].title) || '');
    det.innerHTML = '<summary>📖 解析与考点（点击展开）</summary>'
      + U.explanationHTML(q, { correctText: corText, myText: entry.userText, myOk: entry.ok, grammar: grammarName });
    qbox.appendChild(det);
  }

  function lastQ() { return S.idx >= S.questions.length - 1; }

  /* ---------- 单题统计落库（AI 题含来源/年级/阶段/大专题标记） ---------- */
  function commitStats(q, entry) {
    var isAI = !!(q.isAI || q.source === 'ai');
    var meta = q.aiMeta || {};
    // AI 题按所属大专题计入 tag（topicId 形如 ai:verb），用于能力总览
    var tid = isAI ? ('ai:' + (meta.catId || 'verb')) : S.topicId;
    var tag = q.tag || '未分类';
    E.addDaily(entry.ok ? 1 : 0, 1);
    E.addGlobal(entry.ok ? 1 : 0, 1);
    E.recordTag(tid, tag, entry.ok);
    if (!entry.ok) {
      var corText = q.type === 'choice' ? q.options[q.answerIndex] : (q.answerText || (q.accepted && q.accepted[0]));
      var topicTitle = isAI ? ((meta.gradeName || 'AI') + ' · ' + (meta.catName || 'AI出题')) : (E.bank()[S.topicId] ? E.bank()[S.topicId].title : S.title);
      E.addWrong({
        topicId: tid,
        topicTitle: topicTitle,
        qid: q.id,
        question: q.question,
        tag: tag,
        myAnswer: entry.userText,
        correctAnswer: corText,
        wrongType: q.wrongType || 'CONTEXT_ERROR',
        source: isAI ? 'ai' : 'bank',
        grade: meta.gradeName || '',
        stage: meta.stage || '',
        catId: meta.catId || '',
        explText: isAI ? (q.explanation ? q.explanation.why : '') : '',
        kp: meta.knowledgePoint || tag
      });
    }
  }

  /* ---------- 完成一轮 ---------- */
  function finish() {
    var seconds = Math.round((E.util.nowTs() - S.startTs) / 1000);
    var correct = 0, total = S.questions.length;
    S.answers.forEach(function (a) { if (a && a.ok) correct++; });

    var tid = S.topicId;
    if (S.kind === 'core' && (S.mode === 'normal' || S.mode === 'blind')) {
      E.updateTopicStat(tid, correct, total, S.mode);
    }
    var sessLabel = S.kind === 'ai' ? (S.title || 'AI 出题训练') : '';
    E.addSession(tid, kindModeName(), correct, total, seconds, sessLabel);
    E.save();

    var choiceC = 0, choiceT = 0, inputC = 0, inputT = 0;
    var errByTag = {}, errByType = {};
    S.answers.forEach(function (a) {
      if (!a) return;
      if (a.q.type === 'choice') { choiceT++; if (a.ok) choiceC++; }
      else { inputT++; if (a.ok) inputC++; }
      if (!a.ok) {
        var tg = a.q.tag || '未分类';
        errByTag[tg] = (errByTag[tg] || 0) + 1;
        errByType[a.q.wrongType || 'OTHER'] = (errByType[a.q.wrongType || 'OTHER'] || 0) + 1;
      }
    });
    renderResult({
      correct: correct, total: total, seconds: seconds,
      choiceC: choiceC, choiceT: choiceT, inputC: inputC, inputT: inputT,
      errByTag: errByTag, errByType: errByType
    });
    // 本轮已结束（成绩页）：解除"练习中"保护，允许正常导航
    E.ui.quizActive = false;
  }
  function kindModeName() {
    if (S.kind === 'retrain') return 'retrain';
    if (S.kind === 'challenge') return 'challenge';
    if (S.kind === 'wrongretrain') return 'wrongretrain';
    if (S.kind === 'mixed') return 'mixed';
    if (S.kind === 'ai') return 'ai';
    return S.mode;
  }

  /* ---------- 成绩页 ---------- */
  function renderResult(m) {
    var v = appView();
    if (!v) return;
    v.innerHTML = '';
    var p = m.correct / m.total;
    var grade = U.gradeOf(m.correct, m.total);
    var isCore = S.kind === 'core';
    var topicFull = E.bank()[S.topicId];

    var hero = el('div', 'glass score-hero');
    hero.style.setProperty('--p', (p * 100));
    hero.style.setProperty('--grade-c', grade.color);
    hero.innerHTML = '<div class="grade-ring"><div class="g" style="color:' + grade.color + '">' + grade.g + '</div>'
      + '<div class="gsub">等级</div></div>'
      + '<div class="big">' + m.correct + ' / ' + m.total + '</div>'
      + '<div class="sub">正确率 ' + pct(p) + ' · 用时 ' + U.fmtTime(m.seconds) + '</div>';
    v.appendChild(hero);

    var ov = el('div', 'grid cards3');
    ov.style.marginTop = '12px';
    ov.innerHTML =
      '<div class="glass metric"><div class="v">' + m.correct + '/' + m.total + '</div><div class="k">总正确</div></div>'
      + '<div class="glass metric"><div class="v">' + m.choiceC + '/' + m.choiceT + '</div><div class="k">选择题</div></div>'
      + '<div class="glass metric"><div class="v">' + m.inputC + '/' + m.inputT + '</div><div class="k">输入题</div></div>';
    v.appendChild(ov);

    var wrongTotal = m.total - m.correct;

    // 挑战解锁提示
    if (isCore && p >= 0.9) {
      var ul = el('div', 'glass rec-card');
      ul.style.marginTop = '12px';
      ul.innerHTML = '<b>🎯 挑战模式已解锁！</b>'
        + '<div class="why">正确率 ≥90%！挑战 5 道「全输入·15-30词·无提示」题，检验真功夫。</div>'
        + '<div class="btn-row" style="margin-top:10px"><button class="btn warn sm" data-chal="1">开始挑战模式</button></div>';
      v.appendChild(ul);
    }

    // 主要问题
    var tagKeys = Object.keys(m.errByTag);
    if (tagKeys.length) {
      var pr = el('div', 'glass', '');
      pr.style.marginTop = '12px';
      pr.style.padding = '14px 16px';
      var chips = tagKeys.map(function (k) {
        return '<span class="problem-chip"><b>' + m.errByTag[k] + '</b> 题 · ' + esc(k) + '</span>';
      }).join('');
      pr.innerHTML = '<div class="sec-title" style="margin-top:0">你的主要问题</div><div>' + chips + '</div>';
      v.appendChild(pr);

      var topTag = tagKeys[0];
      var sug = el('div', 'glass rec-card');
      sug.style.marginTop = '12px';
      sug.innerHTML = '<div class="sec-title" style="margin-top:0">建议</div>'
        + '<p class="muted small">先回看知识卡 → 再用「再练 5 题」专攻 <b>' + esc(topTag) + '</b>（会生成全新句子，不重复）。</p>'
        + '<div class="btn-row" style="margin-top:10px">'
        + '<button class="btn ok sm" data-retrain="1">♻️ 再练 5 题</button>'
        + '<button class="btn ghost sm" data-topic="' + S.topicId + '">📘 回看知识卡</button></div>';
      v.appendChild(sug);
    }

    // 逐题回顾
    var rev = el('div', '');
    rev.appendChild(el('div', 'sec-title', '逐题回顾（点开看答案与解析）'));
    S.answers.forEach(function (a, i) {
      if (!a) return;
      var card = el('div', 'glass wb-item');
      card.style.borderLeftColor = a.ok ? 'var(--ok)' : 'var(--bad)';
      var head = '<div class="head"><span class="badge ' + (a.ok ? 'green' : 'red') + '">第' + (i + 1) + '题 ' + (a.ok ? '✓ 对' : '✗ 错') + '</span>'
        + (a.q.tag ? '<span class="badge blue">' + esc(a.q.tag) + '</span>' : '')
        + (a.q.type === 'choice' ? '<span class="badge gray">选择</span>' : '<span class="badge gray">输入</span>') + '</div>';
      var corText = a.q.type === 'choice' ? a.q.options[a.q.answerIndex] : (a.q.answerText || (a.q.accepted && a.q.accepted[0]));
      card.innerHTML = head + '<div class="q">' + esc(a.q.question) + '</div>'
        + '<div class="wb-meta"><span>我的答案：<span style="color:' + (a.ok ? 'var(--ok)' : 'var(--bad)') + ';font-weight:700">' + esc(a.userText || '（未答）') + '</span></span>'
        + '<span>正确答案：<span class="cora">' + esc(corText) + '</span></span></div>';
      var det = el('details', 'qa explanation-panel');
      var revIsAI = !!(a.q.isAI || a.q.source === 'ai');
      var gName = revIsAI ? ((a.q.aiMeta && a.q.aiMeta.catName) || 'AI出题')
        : ((E.bank()[S.topicId] && E.bank()[S.topicId].title) || '');
      det.innerHTML = '<summary>📖 查看解析与考点</summary>' + U.explanationHTML(a.q, { correctText: corText, myText: a.userText, myOk: a.ok, grammar: gName });
      card.appendChild(det);
      rev.appendChild(card);
    });
    v.appendChild(rev);

    // 5 句话复习 + 考场判断（核心专题）

      var byTag = {};
      S.answers.forEach(function (a) {
        if (!a) return;
        byTag[a.q.tag] = byTag[a.q.tag] || { c: 0, t: 0 };
        byTag[a.q.tag].t++;
        if (a.ok) byTag[a.q.tag].c++;

    if (S.kind === 'ai') {

        if (!a) return;
        var kp = (a.q.aiMeta && a.q.aiMeta.knowledgePoint) || a.q.tag || '未分类';
        aiBy[kp] = aiBy[kp] || { c: 0, t: 0 };
        aiBy[kp].t++;
        if (a.ok) aiBy[kp].c++;
      });

      ab.style.marginTop = '12px';
      ab.style.padding = '12px 16px';
      var rows2 = '<table class="mini-table"><tr><th>知识点</th><th>答对</th><th>正答率</th></tr>';
      Object.keys(aiBy).forEach(function (k) {
        var it = aiBy[k];

      else if (kindNow === 'wrongretrain') startWrongRetrain(tidNow);

        // 用同一组 AI 题重做；无缓存则回到 AI 页
        if (S._aiQuestions && S._aiQuestions.length) {

    if (kindNow === 'core' && S.topicId !== 'challenge') {

      r5.addEventListener('click', function () {
        startRetrain(S.topicId, Object.keys(m.errByTag)[0] || null);

    foot.appendChild(back); foot.appendChild(home);

    $$('[data-chal]', v).forEach(function (b) {
      b.addEventListener('click', function () { startChallenge(S.topicId); });
    });
    $$('[data-retrain]', v).forEach(function (b) {
      b.addEventListener('click', function () {
        var tag = Object.keys(m.errByTag)[0] || '';
        startRetrain(S.topicId, tag);
      });
    });
    $$('[data-topic]', v).forEach(function (b) {
      b.addEventListener('click', function () { E.ui.go('topic/' + b.dataset.topic); });
    });
    v.scrollIntoView({ block: 'start' });
  }

  /* ---------- 退出 ---------- */
  function askExit() {
    if (!S) return;
    var kind = S.kind;
    U.confirmBox('退出本轮练习', '已答题目会计入统计，但整轮成绩不计入专题。确定退出？', '退出', true).then(function (ok) {
      if (!ok) return;
      // 整篇卷面模式：退出前把已作答的空落库（与交卷同一逻辑）
      if (kind === 'ai' && S._sheetMode && S.questions) {
        S.questions.forEach(function (q, i) {
          if (!S.answers[i] && q.type !== 'choice' && S._typed && S._typed[i] && String(S._typed[i]).trim()) {
            var t = String(S._typed[i]).trim();

          }

          if (S.answers[i]) commitStats(q, S.answers[i]);

      + '<div class="mode-grid" style="margin-top:16px">'
      + '<div class="mode-card glass" data-m="normal"><div class="ic">📖</div><h4>普通模式</h4><p>每题即时反馈，边做边学。</p></div>'
      + '<div class="mode-card glass" data-m="blind"><div class="ic">🎭</div><h4>盲做模式（模拟考试）</h4><p>20 题一口气做完，再统一看成绩与解析。</p></div>'
      + '</div>';
    v.appendChild(card);
    $$('[data-m]', card).forEach(function (c) {

  E.quiz = {

    startWrongRetrain: startWrongRetrain, startMixed: startMixed, mixedGate: mixedGate,
    startAI: startAI, askExit: askExit, isActive: function () { return !!S; }
  };
})();


/* ============================================================
 * ui-ai.js — AI 出题界面 + 生成编排

(function () {

      var raw = localStorage.getItem(LS_CFG);

        var p = JSON.parse(raw);
        for (var k in p) if (p.hasOwnProperty(k)) d[k] = p[k];

    try { localStorage.setItem(LS_CFG, JSON.stringify(c)); } catch (e) {}
  }
  function appView() { return E.ui && E.ui.app ? E.ui.app.view : null; }
  function closestOf(node, sel) {
    while (node && node !== document) {

      node = node.parentNode;

  /* ================= 页面 ================= */
  function aiPage() {
    var v = appView();

    if (!_keyCache) _keyCache = (typeof cfg.apiKey === 'string') ? cfg.apiKey : '';
    cfg.apiKey = _keyCache;

    v.appendChild(el('div', '', '<div class="page-title"><span class="ico">🤖</span>AI 出题 · 语法填空</div>'
      + '<div class="page-sub">按“高一/高二/高三 × 专题 × 题数”生成完整语篇；结果进入原做题界面，判分/解析/错题/统计全部通用。</div>'));

    var panel = el('div', 'glass', '');

    var btnRow = el('div', '', '<div class="btn-row" style="margin-top:16px">'

    v.appendChild(btnRow);

    ensureBound(v);      // 视图级委托：只绑一次
